<!-- MATEO ESTRADA-MGEA ---- HTML y CSS -->
<!DOCTYPE html>
<html lang="es"> <!-- Idioma del documento -->
<head>
    <meta charset="UTF-8"> <!-- Codificación de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Vista adaptable a dispositivos -->
    <title>Dating Login - MATEO ESTRADA-MGEA</title> <!-- Título de la página -->
    <link rel="stylesheet" href="style5.css"> <!-- Enlaza el CSS -->
</head>
<body> <!-- Inicio del cuerpo -->
    <div class="card"> <!-- Tarjeta del formulario -->
        <h2>CITAESTRADA</h2> <!-- Título con ícono (rombo) -->

            <input type="text" placeholder="Username"> <!-- Campo de texto para usuario -->

        </form> <!-- Fin del formulario -->
    </div> <!-- Fin de la tarjeta -->
</body> <!-- Fin del cuerpo -->
